name: customer_journey
version: '1.0.0'
config-version: 2
profile: customer_journey

model-paths: ["models"]

models:
  customer_journey:
    raw_layer:
      +materialized: table
      Policy:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: ID
      ChangeEvent:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: ID
      Survey:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: ID
      # Contact: kept as `table` (falls through to the raw_layer default
      # above) until ContactEventsByContact's join (currently a placeholder
      # `ON FALSE` in ContactRaw.sql, join key TBD) is diagnosed. The
      # is_incremental() watermark guard already exists in ContactRaw.sql
      # (LASTMODIFIEDDATE, unverified against prod) — flip this block back
      # on when the join is fixed, no SQL changes needed at that point.
      # Contact:
      #   +materialized: incremental
      #   +incremental_strategy: merge
      #   +unique_key: ID
    metric_layer:
      +materialized: table
    wide_layer:
      +materialized: table
    view_layer:
      +materialized: view