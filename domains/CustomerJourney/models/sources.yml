version: 2

sources:
  - name: rten
    database: PRD_EDBIDB
    schema: RTEN
    description: "RTEN retention source tables (trial-account mirrors of production)."
    tables:
      - name: rten_xcmpy_pif_tbl
        description: "Current-state policy snapshot. 1 row per policy. Prod: 42M rows / 5 GB."
        columns:
          - name: PLCY_CNTRCT_NUM
            tests:
              - not_null
              - unique
          - name: PLCY_INCEPT_DT
            description: "ORIGINAL inception ever — tenure anchor, NOT current-term start."
            tests:
              - not_null
          - name: CNCL_DT
            description: "NULL = in force."

      - name: rten_dim_pl_trn_xlob
        description: "Policy transaction dimension. Prod: 421M rows / 172 GB. NEVER join directly — read through RawPolicy (deduped + quarantined)."
        columns:
          - name: PLCY_CNTRCT_NUM
            tests:
              - not_null
          - name: RESDC_ZIP_5_CD
            description: "5-digit residential ZIP — use for move detection."
          - name: RESDC_FULL_ZIP_CD
            description: "ZIP+4 — do NOT use for move detection (mail-routing noise)."
          - name: SRC_SYS_CD
            description: "Txn-level source system (EA, GWPC, AFL, AFO)."
          - name: EFF_DT
            description: "Transaction effective date — event ordering anchor (with SRC_TRANS_TMSP tiebreak)."
          - name: SRC_TRANS_TMSP
            description: "Source transaction timestamp — tiebreak within same EFF_DT; audit lineage pointer."
          - name: AGT_OF_RECRD_NUM
            description: "Agent of record at transaction time — LAG comparison yields AGENT_CHANGE events."

      - name: tfrdb_fws_pol_snap_mthly_rpt
        description: "FWS monthly policy snapshot — the existing pattern the Farmers archive replicates. Prod: 5.4M rows / 83 MB."
        columns:
          - name: SNAP_YR_MO_CD
            description: "Snapshot month YYYY-MM — the archive stamp."
          - name: EXT_POL_SFX_CONCAT_CD
            description: "Policy number."

  - name: fdr
    database: PRD_EDBIDB
    schema: FDR
    description: "FDR master data. ~100% coverage FARMERS + FWS; ZERO Bristol West / Specialty."
    tables:
      - name: fdr_mdm_plcy_stats
        description: "MDM policy master (SCD2). Holds PRIOR_PLCY (authoritative NB/RB) and AFFILIATION_TYP."
        columns:
          - name: PLCY_NUM
            description: "Join key → RTEN_XCMPY_PIF_TBL.PLCY_CNTRCT_NUM."
            tests:
              - not_null
          - name: PRIOR_PLCY
            description: "NULL = New Business. THE authoritative NB/RB signal — replaces the broken DATEDIFF rule."
          - name: AFFILIATION_TYP
            description: "EM = Employee/Member (FWS onboarding cohort)."
