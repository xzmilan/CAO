name: CustomerJourney dbt Deploy

# CAO (Consumer Analytics Orchestration) — Snowflake deploy/build workflow.
#
# This is the ONLY workflow that touches Snowflake. Cadence is SCHEDULED
# (nightly), not per-merge — merges to main just update the branch; the
# 7am ET run picks up everything accumulated since the prior run in one
# batched deploy. This is deliberate: with incremental raw models
# (PolicyRaw/ChangeEventRaw/SurveyRaw), triggering a full deploy pipeline on
# every merge means paying Snowflake warehouse spin-up/MERGE overhead
# per-merge instead of once per day for the same eventual freshness. A
# manual `workflow_dispatch` trigger is available for on-demand runs
# (e.g. testing a change immediately rather than waiting for the schedule).
#
# It's separate from the PR-gating workflow (customer_journey_ci.yml) so PR
# checks never depend on Snowflake secrets that may not be provisioned yet —
# your PR can pass all the rules without IT having set anything up.
#
# CURRENT STATE (trial account, password auth): this deploys against
# xzmilan's personal Snowflake trial account (RDCAAHU-BL07485), hardcoded
# below as plain env values — no repo Variables needed. The only secret
# required is SNOWFLAKE_PASSWORD (Settings > Secrets and variables > Actions
# > Secrets tab). When Farmers IT provisions the real service account
# (svc-cx-snfl-git, key-pair/SNOWFLAKE_JWT auth), swap the env: block back
# to vars.SNOWFLAKE_* + SNOWFLAKE_PRIVATE_KEY/SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
# secrets and point at the Farmers account/role/warehouse/database.
#
# CRON NOTE: GitHub Actions schedule cron is ALWAYS UTC, never local time.
# 7:00 AM ET = 12:00 UTC during EST (standard time). 
# Actions does not auto-adjust for DST. Cron below is pinned to 12:00 UTC
# (true 7am during EST).
# Flag this on the calendar or it will drift silently every March/November.
# Need to monitor table update schedule and adjust cron if necessary.

on:
  schedule:
    - cron: "0 12 * * *"   # 7:00 AM ET (EST, UTC-5) — see CRON NOTE above
  workflow_dispatch: {}   # allow manual trigger from the Actions tab

defaults:
  run:
    working-directory: domains/CustomerJourney

jobs:
  deploy:
    name: Deploy + Build to Snowflake
    runs-on: ubuntu-latest
    env:
      # Hardcoded to xzmilan's personal trial account — password auth via
      # the SNOWFLAKE_PASSWORD repo secret (the only Snowflake secret
      # actually set on this repo today). No repo Variables needed.
      SNOWFLAKE_ACCOUNT: RDCAAHU-BL07485
      SNOWFLAKE_USER: xzmilan
      SNOWFLAKE_ROLE: ACCOUNTADMIN
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_DATABASE: MZ_SF
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate wide layer from metric files
        run: python3 tools/generate_wide_layer.py
      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs
      - name: Report runner egress IP
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "runner_egress_ip=$IP"
          curl -s "https://ipinfo.io/$IP/json"
      - name: Create CUSTOMERJOURNEY schema if needed
        run: |
          snow sql --temporary-connection -q "CREATE SCHEMA IF NOT EXISTS $SNOWFLAKE_DATABASE.CUSTOMERJOURNEY"
      - name: Deploy DBT PROJECT
        run: |
          snow dbt deploy customer_journey \
            --temporary-connection \
            --source . \
            --database $SNOWFLAKE_DATABASE \
            --schema CUSTOMERJOURNEY \
            --dbt-version 1.11.11
      - name: Execute build
        run: |
          snow dbt execute customer_journey \
            --temporary-connection \
            --database $SNOWFLAKE_DATABASE \
            --schema CUSTOMERJOURNEY \
            build --target dev
