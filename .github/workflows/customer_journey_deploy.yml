name: CustomerJourney dbt Deploy

# CAO (Consumer Analytics Orchestration) — Snowflake deploy/build workflow.
#
# This is the ONLY workflow that touches Snowflake, and it only runs on merge
# to main. It's separate from the PR-gating workflow (customer_journey_ci.yml)
# so PR checks never depend on Snowflake secrets that may not be provisioned
# yet — your PR can pass all the rules without IT having set anything up.
#
# It needs a Snowflake SERVICE ACCOUNT (not a personal account), supplied
# via GitHub Secrets/Variables. See the CAO README for setup steps.
#
# Trial-mode deploy — hardcoded to xzmilan's trial Snowflake account.
# When Farmers IT provisions the service account + opens the IP allowlist,
# swap the env: block back to ${{ vars.SNOWFLAKE_* }} / ${{ secrets.SNOWFLAKE_PASSWORD }}
# and point at the Farmers account/role/warehouse/database.

on:
  push:
    branches: [main]
    paths:
      - "domains/CustomerJourney/**"
      - ".github/workflows/customer_journey_deploy.yml"
  workflow_dispatch: {}   # allow manual trigger from the Actions tab

defaults:
  run:
    working-directory: domains/CustomerJourney

jobs:
  deploy:
    name: Deploy + Build to Snowflake (Trial)
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: RDCAAHU-BL07485
      SNOWFLAKE_USER: xzmilan
      SNOWFLAKE_ROLE: ACCOUNTADMIN
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_DATABASE: MZ_SF
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs
      - name: Create CUSTOMERJOURNEY schema if needed
        run: |
          snow sql --temporary-connection -q "CREATE SCHEMA IF NOT EXISTS MZ_SF.CUSTOMERJOURNEY"
      - name: Deploy DBT PROJECT
        run: |
          snow dbt deploy customer_journey \
            --temporary-connection \
            --source . \
            --dbt-version 1.11.11
      - name: Execute build
        run: |
          snow dbt execute customer_journey \
            --temporary-connection \
            build --target dev
